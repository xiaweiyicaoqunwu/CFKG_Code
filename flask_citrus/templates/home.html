{% extends "layout_public.html" %}

{% block content %}
<style>
    /* 轮播图高度控制 */
    .carousel-item img {
        height: 85vh; /* 占据视口高度的85% */
        object-fit: cover; /* 保持比例填充 */
        filter: brightness(0.8); /* 稍微变暗，让文字更清晰 */
    }
    
    /* 按钮定位与样式：参考字节跳动风格 */
    .hero-content {
        position: absolute;
        top: 60%; /* 中间靠下 */
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10;
        width: 100%;
    }

    .btn-explore {
        background-color: rgba(255, 255, 255, 0.9);
        color: #006633;
        font-weight: bold;
        padding: 15px 40px;
        font-size: 1.2rem;
        border-radius: 50px;
        border: none;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        display: inline-block; /* 确保 transform 可用 */
    }

    .btn-explore:hover {
        background-color: #fff;
        transform: scale(1.05); /* 仅放大，不位移 */
        color: #004d26;
    }
    
    .hero-title {
        color: white;
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 30px;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }
</style>

<div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="{{ url_for('static', filename='images/banner1.jpg') }}" class="d-block w-100" alt="Citrus Field">
            <div class="hero-content">
                <h1 class="hero-title">Explore Citrus Flavor</h1>
                <a href="{{ url_for('index') }}" class="btn btn-explore">Explore KG</a>
            </div>
        </div>
        <div class="carousel-item">
            <img src="{{ url_for('static', filename='images/banner2.jpg') }}" class="d-block w-100" alt="Knowledge Graph Art">
            <div class="hero-content">
                <h1 class="hero-title">Stimulate the Taste Buds</h1>
                <a href="{{ url_for('index') }}" class="btn btn-explore">Explore KG</a>
            </div>
        </div>
        <div class="carousel-item">
            <img src="{{ url_for('static', filename='images/banner3.jpg') }}" class="d-block w-100" alt="Tech Background">
            <div class="hero-content">
                <h1 class="hero-title">Data-driven Knowledge Graph</h1>
                <a href="{{ url_for('index') }}" class="btn btn-explore">Explore KG</a>
            </div>
        </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>
{% endblock %}
